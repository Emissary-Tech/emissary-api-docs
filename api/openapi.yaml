        base_model_option:
          type: string
          example: "pre-trained"
        last_access_timestamp:
          type: integer
          example: 1633036800
        resource_management_config:
          oneOf:
            - title: Inactive Timeout
              description: Specifies the period of inactivity, in seconds, after which the deployment will be automatically deactivated if no incoming requests are received. While deactivated, the deployment incurs no charges. When a request is sent to a deactivated deployment, it will be reactivated to process the request; this reactivation process typically introduces a delay of approximately 8 to 20 minutes before the deployment becomes fully operational.
              type: object
              properties:
                management_type:
                  type: string
                  example: "inactive_timeout"
                management_config:
                  type: object
                  properties:
                    inactive_duration:
                      type: integer
                      example: 3600
                      description: Period of inactivity
            - title: Schedule
              description: Specifies the schedule which the engine will be deployed with deployments (if existing on the engine).
              type: object
              properties:
                management_type:
                  type: string
                  example: "schedule"
                management_config:
                  type: object
                  properties:
                    timezone:
                      type: string
                      example: "America/Los_Angeles"
                      description: The IANA timezone for the schedule
                    start_time:
                      type: string
                      example: "10:00"
                      description: The start time for the schedule in HH:MM format
                    end_time:
                      type: string
                      example: "18:00"
                      description: The end time for the schedule in HH:MM format
                    days:
                      type: array
                      example: [ "monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday" ]
                      items:
                        type: string
                        enum:
                          - monday
