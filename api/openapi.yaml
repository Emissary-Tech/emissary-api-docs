  '/v1/routers':
    get:
      tags:
        - Routers
      summary: List routers
      description: Returns the routers of your account (or organization).
      operationId: listRouters
      responses:
        '200':
          description: Your routers
          content:
            application/json:
              schema:
                type: object
                properties:
                  routers:
                    type: array
                    items:
                      "$ref": "#/components/schemas/Router"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Routers
      summary: Create router
      description: |-
        Create a router. Its `mode` is required and can't change afterwards:

        - `proposal`: your app sends its request to `POST /v1/route`, gets back the router's ranked candidates, and calls the chosen model itself, with its own keys. A Proposal Mode router takes no providers or keys.
        - `gateway`: your app sends its requests to the gateway (`https://api.withemissary.com/gateway`) with `model` set to the router's name, and Emissary serves the model it picks with the provider keys stored on the router. Every enabled model needs a `provider`, and every provider the models name needs a key in `providers`.

        A model entry needs only its `name` (and, on a gateway router, its `provider`). What it leaves out comes from the router model's catalog (`GET /v1/router-models`): prices, context window, vision support, and `model_id` (the model's name on a Proposal Mode router, its id at the chosen provider on a gateway router).
      operationId: createRouter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RouterCreate"
            examples:
              proposal:
                summary: Proposal Mode router
                value:
                  name: prod
                  mode: proposal
                  default: claude-haiku-4.5
                  target_models:
                    - name: deepseek-v4-flash
                    - name: qwen3.8-flash
                    - name: claude-haiku-4.5
              gateway:
                summary: Gateway router
                value:
                  name: prod-gateway
                  mode: gateway
                  default: claude-haiku-4.5
                  target_models:
                    - name: deepseek-v4-flash
                      provider: openrouter
                    - name: deepseek-v4-flash-0731
                      provider: openrouter
                      effort_routing_enabled: true
                    - name: claude-haiku-4.5
                      provider: openrouter
                  providers:
                    - name: openrouter
                      api_key: sk-or-v1-...
      responses:
        '201':
          description: The created router
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Router"
        '400':
          $ref: '#/components/responses/InvalidRouter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/RouterNameTaken'
  '/v1/routers/{router_name}':
    get:
      tags:
        - Routers
      summary: Retrieve router
      description: Retrieve one of your routers by its name.
      operationId: getRouterByName
      parameters:
        - "$ref": "#/components/parameters/RouterName"
      responses:
        '200':
          description: The router with this name
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Router"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RouterNotFound'
    patch:
      tags:
        - Routers
      summary: Update router
      description: |-
        Change the fields you send and keep the rest.

        - `target_models` and `providers` are replaced as a whole: send the full list. Model entries are filled from the catalog as on create.
        - A provider sent without `api_key` keeps its stored key.
        - `mode` can't change. Leave it out, or send the router's current mode.
        - A new `name` takes effect immediately: requests that use the old name fail with 404.
      operationId: updateRouterByName
      parameters:
        - "$ref": "#/components/parameters/RouterName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RouterUpdate"
            examples:
              confidence:
                summary: Change the confidence
                value:
                  confidence: 0.5
              models:
                summary: Replace the models
                value:
                  default: claude-haiku-4.5
                  target_models:
                    - name: deepseek-v4-flash
                    - name: claude-haiku-4.5
              rename:
                summary: Rename
                value:
                  name: prod-v2
              key:
                summary: Replace a provider key
                value:
                  providers:
                    - name: openrouter
                      api_key: sk-or-v1-...
      responses:
        '200':
          description: The updated router
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Router"
        '400':
          $ref: '#/components/responses/InvalidRouter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RouterNotFound'
        '409':
          $ref: '#/components/responses/RouterNameTaken'
    delete:
      tags:
        - Routers
      summary: Delete router
      description: Delete one of your routers. Requests that name it fail with 404 afterwards.
      operationId: deleteRouterByName
      parameters:
        - "$ref": "#/components/parameters/RouterName"
      responses:
        '204':
          description: Router deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/RouterNotFound'
  '/v1/route':
    post:
      tags:
        - Proposal Mode
      summary: Route a request
      description: |-
        Ask a Proposal Mode router which model should serve a request. Put the request in `body` exactly as you'd send it to the provider (OpenAI Chat Completions, OpenAI Responses or Anthropic Messages). The router scores it and returns its candidates, most recommended first; nothing is sent to any provider.

        Your app then calls the first candidate's `model_id` with its own provider key (at the candidate's `effort`, when it has one), moves down the list if that call fails, and reports what the provider answered to `POST /v1/route/{decision_id}/usage`.

        Routing is cache-aware within a session: send `session_id`, or the end client's headers in `headers` (where Claude Code, Codex and other known clients carry theirs), so a conversation's later turns can stay on the model whose prompt cache is warm.
      operationId: routeRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RouteRequest"
            examples:
              chat:
                summary: An OpenAI Chat Completions request
                value:
                  router: prod
                  body:
                    model: gpt-6.1-terra
                    messages:
                      - role: user
                        content: Summarize this changelog in three bullet points.
                  session_id: conv-8f2c
                  request_id: my-req-001
              messages:
                summary: An Anthropic Messages request, with the client's headers
                value:
                  router: prod
                  body:
                    model: claude-sonnet-5
                    max_tokens: 1024
                    system: You are a coding assistant.
                    messages:
                      - role: user
                        content: Why does this test fail intermittently?
                  headers:
                    x-claude-code-session-id: 3d1f9a6e-5b7c-4e2a-9c1d-0f8e7a6b5c4d
      responses:
        '200':
          description: The router's candidates for the request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RouteProposal"
        '400':
          description: |-
            The request can't be routed as sent: the body isn't a JSON object, a field is missing or invalid (`router`, `body`), or the router is a gateway router.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiErrorMessage"
              example:
                error: 'Router "prod-gateway" is a gateway router: send its requests to the gateway with model "prod-gateway". Proposal Mode (/v1/route) needs a Proposal Mode router.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCreditsOpenAI'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: None of your routers has the name in `router`
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiErrorMessage"
              example:
                error: "No router 'staging' found"
  '/v1/route/{decision_id}/usage':
    post:
      tags:
        - Proposal Mode
      summary: Report usage
      description: |-
        Report what the provider answered for a request your app served: the candidate it called, and the provider's `usage` object as the provider returned it (Anthropic Messages, OpenAI Chat Completions or OpenAI Responses). The decision is then priced, with its savings against the router's most expensive model, and shown with its cost on the dashboard.

        A decision's usage is recorded once. A repeated report is still accepted (202) and changes nothing, so retrying is always safe.
      operationId: reportRouteUsage
      parameters:
        - name: decision_id
          in: path
          required: true
          description: The `decision_id` that `POST /v1/route` returned
          schema:
            type: string
            example: "dec-2b7e1f0c-9a4d-4c3e-8f5a-6d1b2c3e4f5a"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UsageReport"
            examples:
              openai:
                summary: OpenAI Chat Completions usage
                value:
                  model: deepseek-v4-flash-0731
                  usage:
                    prompt_tokens: 412
                    completion_tokens: 96
                    total_tokens: 508
                  status: 200
              anthropic:
                summary: Anthropic Messages usage
                value:
                  model: claude-haiku-4.5
                  usage:
                    input_tokens: 1830
                    output_tokens: 240
                    cache_read_input_tokens: 12000
                    cache_creation_input_tokens: 0
                  status: 200
      responses:
        '202':
          description: Recorded, or recorded already
        '400':
          description: The report isn't a JSON object, `model` is missing, or `usage` isn't a usage object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiErrorMessage"
              example:
                error: "`model`: Field required"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No decision of yours has this id
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ApiErrorMessage"
              example:
                error: "No decision 'dec-0000' found"
  '/gateway/v1/chat/completions':
    post:
      tags:
        - Gateway
      summary: Chat Completions
      description: |-
        OpenAI-compatible Chat Completions through a gateway router. Set `model` to the router's name: the router picks one of its models, Emissary calls it with the router's provider key, and returns the provider's answer in Chat Completions format. The response's `model` is the id of the model that served it. With `stream: true` the answer streams as server-sent events, as OpenAI streams them. If the picked model's provider fails, the router's default model serves instead.

        With the OpenAI SDK, set the base URL to `https://api.withemissary.com/gateway/v1` and the API key to your Emissary API key. The gateway takes the key in `X-API-Key` or as a bearer token (`Authorization: Bearer <key>`), which is how the OpenAI SDK sends it.

        Routing is cache-aware within a session: a session id in an `x-session-id` header, or in the headers Claude Code, Codex and other known clients send, keeps a conversation's later turns on the model whose prompt cache is warm.
      operationId: gatewayChatCompletions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GatewayChatCompletionsRequest"
            example:
              model: prod-gateway
              messages:
                - role: user
                  content: Write a haiku about routing.
              max_tokens: 200
      responses:
        '200':
          description: The provider's answer, in Chat Completions format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GatewayResponse"
            text/event-stream:
              schema:
                type: string
                description: Chat Completions chunks, sent when the request sets `stream` to true
        '400':
          $ref: '#/components/responses/GatewayRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCreditsOpenAI'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GatewayRouterNotFound'
        '504':
          $ref: '#/components/responses/UpstreamTimeoutOpenAI'
        default:
          $ref: '#/components/responses/ProviderError'
  '/gateway/v1/responses':
    post:
      tags:
        - Gateway
      summary: Responses
      description: |-
        OpenAI-compatible Responses API through a gateway router. Set `model` to the router's name: the router picks one of its models, Emissary calls it with the router's provider key, and returns the provider's answer in Responses format. With `stream: true` the answer streams as server-sent events. If the picked model's provider fails, the router's default model serves instead.

        With the OpenAI SDK (or Codex), set the base URL to `https://api.withemissary.com/gateway/v1` and the API key to your Emissary API key. The gateway takes the key in `X-API-Key` or as a bearer token (`Authorization: Bearer <key>`), which is how the OpenAI SDK sends it.
      operationId: gatewayResponses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GatewayResponsesRequest"
            example:
              model: prod-gateway
              input: Write a haiku about routing.
              max_output_tokens: 200
      responses:
        '200':
          description: The provider's answer, in Responses format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GatewayResponse"
            text/event-stream:
              schema:
                type: string
                description: Responses events, sent when the request sets `stream` to true
        '400':
          $ref: '#/components/responses/GatewayRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCreditsOpenAI'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GatewayRouterNotFound'
        '504':
          $ref: '#/components/responses/UpstreamTimeoutOpenAI'
        default:
          $ref: '#/components/responses/ProviderError'
  '/gateway/v1/messages':
    post:
      tags:
        - Gateway
      summary: Messages
      description: |-
        Anthropic-compatible Messages API through a gateway router. Set `model` to the router's name: the router picks one of its models, Emissary calls it with the router's provider key, and returns the provider's answer in Messages format. With `stream: true` the answer streams as server-sent events, as Anthropic streams them. If the picked model's provider fails, the router's default model serves instead.

        With the Anthropic SDK, set the base URL to `https://api.withemissary.com/gateway` and the API key to your Emissary API key. For Claude Code, set `ANTHROPIC_BASE_URL` to the same URL.
      operationId: gatewayMessages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/GatewayMessagesRequest"
            example:
              model: prod-gateway
              max_tokens: 200
              messages:
                - role: user
                  content: Write a haiku about routing.
      responses:
        '200':
          description: The provider's answer, in Messages format
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/GatewayResponse"
            text/event-stream:
              schema:
                type: string
                description: Messages stream events, sent when the request sets `stream` to true
        '400':
          $ref: '#/components/responses/GatewayRefused'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCreditsAnthropic'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/GatewayRouterNotFound'
        '504':
          $ref: '#/components/responses/UpstreamTimeoutAnthropic'
        default:
          $ref: '#/components/responses/ProviderError'

# An object to hold reusable parts that can be used across the definition
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      schema:
        type: string
      description: The ID of the project
      required: true
    RouterName:
      name: router_name
      in: path
      required: true
      description: The router's name, URL-encoded (`team%2Fprod%20v2` for "team/prod v2")
      schema:
        type: string
  schemas:
    CompletionObject:
      type: object
      properties:
        id:
          type: string
          example: "cmpl-8565e8d5db17438291a189255c36c558"
        object:
          type: string
          example: "text_completion"
        created:
          type: number
          example: 1741570283
        model:
          type: string
          example: "Llama-3.2-1B-Instruct"
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: number
                example: 0
              text:
                type: string
                example: " Paris. The French language is a Romance language and the official language of France."
              logprobs:
                type: [ string, null ]
              prompt_logprobs:
                type: [ string, null ]
              stop_reason:
                type: [ string, null ]
              finish_reason:
                type: string
                example: "length"
        usage:
          type: object
          properties:
            prompt_tokens:
              type: number
              example: 6
            completion_tokens:
              type: number
              example: 16
            total_tokens:
              type: number
              example: 44
            prompt_tokens_details:
              type: [ string, null ]
    ChatCompletionObject:
      type: object
      properties:
        id:
          type: string
          example: "chatcmpl-B9MHDbslfkBeAs8l4bebGdFOJ6PeG"
        object:
          type: string
          example: "chat.completion"
        created:
          type: number
          example: 1741570283
        model:
          type: string
          example: "Llama-3.2-1B-Instruct"
        choices:
          type: array
          items:
            type: object
            properties:
              index:
                type: number
                example: 0
              message:
                type: object
                properties:
                  role:
                    type: string
                    example: "assistant"
                  content:
                    type: string
                    example: "How can I help you today?"
              refusal:
                type: [string, null]
              finish_reason:
                type: string
                example: "stop"
        usage:
          type: object
          properties:
            prompt_tokens:
              type: number
              example: 36
            completion_tokens:
              type: number
              example: 8
            total_tokens:
              type: number
              example: 44
            prompt_tokens_details:
              type: object
              properties:
                cached_tokens:
                  type: number
                  example: 0
                audio_tokens:
                  type: number
                  example: 0
            completion_tokens_details:
              type: object
              properties:
                reasoning_tokens:
                  type: number
                  example: 0
                audio_tokens:
                  type: number
                  example: 0
                accepted_prediction_tokens:
                  type: number
                  example: 0
                rejected_prediction_tokens:
                  type: number
                  example: 0
        service_tier:
          type: string
          example: "default"
        system_fingerprint:
          type: string
          example: "fp_fc9f1d7035"
    BaseModelSummary:
      type: object
      properties:
        name:
          type: string
          example: "Llama-3.2-1B-Instruct"
        support_task:
          type: array
          example: [ "classification", "text-generation", "embeddings" ]
          items:
            type: string
            description: List of task types the base model support
        grpo_support_task:
          type: array
          example: [ "text-generation" ]
          items:
            type: string
            description: List of task types the base model support for GRPO training
    BaseModelDetail:
      type: object
      properties:
        name:
          type: string
          example: "Llama-3.2-1B-Instruct"
        support_task:
          type: array
          example: [ "classification", "text-generation", "embeddings" ]
          items:
            type: string
            description: List of task types the base model support
        grpo_support_task:
          type: array
          example: [ "text-generation" ]
          items:
            type: string
            description: List of task types the base model support for GRPO training
        parameter_template:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: number
              - type: integer
    ProjectSummary:
      type: object
      description: Project Summary Object
      properties:
        id:
          type: string
          example: "ms-12345"
          description: The unique identifier for the project
        name:
          type: string
          example: "my_project"
          description: The name of the project
    ProjectDetail:
      type: object
      description: Project Object
      properties:
        id:
          type: string
          example: "ms-12345"
          description: The unique identifier for the project
        name:
          type: string
          example: "my_project"
          description: The name of the project
        datasets:
          type: array
          items:
            "$ref": '#/components/schemas/DatasetSummary'
        training_jobs:
          type: array
          items:
            "$ref": "#/components/schemas/TrainingJobSummary"
    DatasetSummary:
      type: object
      description: Dataset Summary Object
      properties:
        id:
          type: string
          example: "ds-12345"
          description: The unique identifier for the dataset
        name:
          type: string
          example: "my_dataset"
          description: The name of the dataset
        created_at:
          type: integer
          example: 1633036800
          description: The UNIX timestamp when the dataset was created
        is_uploaded:
          type: boolean
          example: true
    DatasetDetail:
      type: object
      description: Dataset Object
      properties:
        id:
          type: string
          example: "ds-12345"
          description: The unique identifier for the dataset
        name:
          type: string
          example: "my_dataset"
          description: The name of the dataset
        file_name:
          type: string
          example: "dataset.jsonl"
          description: The name of the file
        is_uploaded:
          type: boolean
          example: true
          description: Whether the dataset has been uploaded
        is_profiled:
          type: boolean
          example: true
          description: Whether the uploaded dataset has been profiled
        compatible_task_types:
          type: array
          example: [ "classification" ]
          items:
            type: string
            description: List of compatible task type the dataset can be used
        dataset_download_url:
          type: string
          example: "s3:/my_dataset"
          description: The URL to download the dataset
        upload_by:
          type: string
          example: "user-12345"
          description: The user ID who uploaded the dataset
        created_at:
          type: integer
          example: 1633036800
          description: The timestamp when the dataset was created
        updated_at:
          type: integer
          example: 1633036800
          description: The timestamp when the dataset was last updated
    TestingFunctionSummary:
      type: object
      description: Testing Function Summary Object
      properties:
        name:
          type: string
          example: "similarity_score_shared"
          description: Name of the test function (matched with exact python method name)
        content:
          type: string
          example: "def similarity_score_shared(input_text: str, expected_output: str, predicted_output: str): \n ..."
          description: Contents of test function
        dependencies:
          type: array
          example: [ "external-library" ]
          items:
            type: string
            description: List of external dependencies that needs to be downloaded with pip to run
    TrainingJobSummary:
      type: object
      description: Training Job Summary Object
      properties:
        id:
          type: string
          example: "tr-12345"
          description: The unique identifier for the training job
        name:
          type: string
          example: "training-1"
          description: The name of the training job
        training_technique:
          type: string
          enum:
            - SFT
            - GRPO
          example: "SFT"
          description: "Training technique that has been used for this training job"
        task_type:
          type: string
          enum:
            - text-generation
            - classification
            - embedding
            - regression
          example: "classification"
        base_model_option:
          type: string
          enum:
            - pre-trained
            - fine-tuned
          example: "pre-trained"
          description: "Base model option used for training "
        base_model:
          type: string
          example: "Llama-3.2-1B-Instruct"
          description: The base model used for training
        base_fine_tuned_model:
          type: string
          example: "training-job-1"
          description: (base_model_option == "fine-tuned") Fine-tuned model that is used as a base model for the training job
        base_fine_tuned_model_checkpoint:
          type: int
          example: 5
          description: (base_model_option == "fine-tuned") Check point that is used as a base model for the training job
        train_dataset_name:
          type: string
          example: "train-dataset-1"
          description: Name of the dataset used for fine-tuning
        test_functions:
          type: array
          example: [ "test_similarity_shared" ]
          items:
            type: string
            description: List of test function names used in the training job
        reward:
