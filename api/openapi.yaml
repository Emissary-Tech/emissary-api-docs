  '/v1/router-models':
    get:
      tags:
        - Routers
      summary: List router models
      description: |-
        The router models a new router can use. Each lists the models it can route across (a router's `target_models` name them), the reasoning efforts it can pick for each model, and its recommended confidence.

        Prices here are Emissary's defaults: a router copies them when it's saved, and prices its requests with its own copy.
      operationId: listRouterModels
      responses:
        '200':
          description: The router models, and the one new routers use by default
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/RouterModelList"
