                              additionalProperties:
                                type: number
                                format: float
                                example: 0.9453125
                              example:
                                cat: 0.9453125
                                dog: 0.01875
                                rabbit: 0.0859375
                                turtle: 0.015625
                          required:
                            - index
                            - logits
                        - title: probs
                          type: object
                          properties:
                            index:
                              type: number
                              example: 0
                            probs:
                              type: object
                              description: |
                                A mapping from category labels (as keys) to their corresponding probability values (between 0 and 1).
                                Present when `data_format` is set to `probs`.
                              additionalProperties:
                                type: number
                                format: float
                                example: 0.82
                              example:
                                cat: 0.82
                                dog: 0.02
                                rabbit: 0.13
                                turtle: 0.03
                          required:
                            - index
                            - probs
                  usage:
                    type: object
                    properties:
                      completion_tokens:
                        type: number
                        example: 0
                      prompt_tokens:
                        type: number
                        example: 1587
                      prompt_token_details:
                        type: string
                      total_tokens:
                        type: number
                        example: 1587
