    ApiErrorUnauthorized:
      type: object
      required:
        - status
        - error
      properties:
        status:
          type: integer
          format: int32
          example: 401
        error:
          type: string
          example: Unauthorized
    Router:
      type: object
      description: A router, as the API returns it. Provider keys are never returned.
      properties:
        id:
          type: string
          example: "gwcfg-4mvkcxd2g8znkdt8emswb8"
          description: The router's unique identifier. The API addresses routers by `name`.
        name:
          type: string
          maxLength: 100
          example: "prod"
          description: Unique within your account (or organization). Proposal Mode's `router` field and the gateway's `model` field name the router by it.
        mode:
          type: string
          enum:
            - proposal
            - gateway
          example: proposal
          description: How your app calls the router, fixed when it's created. `proposal` for `POST /v1/route`, `gateway` for the gateway.
        router_model:
          type: string
          example: "emissary-model-router-shared-v3"
          description: The router model that scores each request
        default:
          type: string
          example: "claude-haiku-4.5"
          description: The name of the model the router falls back to when no other model is confident enough; the anchor of every decision. One of the enabled `target_models`.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.65
          description: Minimum score a model needs before it can be picked instead of the default. Higher is more conservative.
        is_zdr:
          type: boolean
          example: true
          description: Zero data retention. When false, request and response payloads are kept for session replay on the dashboard.
        target_models:
          type: array
          description: The models the router can pick
          items:
            "$ref": "#/components/schemas/RouterTargetModel"
        providers:
          type: array
          description: The router's provider credentials, without their keys. Empty on a Proposal Mode router.
          items:
            "$ref": "#/components/schemas/RouterProvider"
        created_at:
          type: integer
          example: 1795551249
          description: Unix timestamp (seconds) of when the router was created
        updated_at:
          type: integer
          example: 1795551257
          description: Unix timestamp (seconds) of the router's last change
    RouterTargetModel:
      type: object
      description: A model the router can pick, priced as the router has it
      properties:
        name:
          type: string
          example: "deepseek-v4-flash"
          description: The model's catalog name, which is also the router model's label for it. Proposal Mode returns it as a candidate's `model`.
        provider:
          type:
            - string
            - "null"
          enum:
            - anthropic
            - openrouter
            - openai
            - litellm
            - baseten
            - null
          example: "openrouter"
          description: Where the gateway serves the model. Null on a Proposal Mode router.
        model_id:
          type: string
          example: "deepseek/deepseek-v4-flash"
          description: The id the model is called by. On a gateway router, what Emissary sends the provider; on a Proposal Mode router, what `POST /v1/route` returns as a candidate's `model_id`, for your app to send.
        enabled:
          type: boolean
          example: true
          description: A disabled model stays on the router but is never picked
        input_per_mtok:
          type: number
          example: 0.14
          description: USD per million input tokens
        output_per_mtok:
          type: number
          example: 0.28
          description: USD per million output tokens
        cache_read_per_mtok:
          type:
            - number
            - "null"
          example: 0.028
          description: USD per million cache-read tokens. Null prices them as input tokens.
        cache_write_per_mtok:
          type:
            - number
            - "null"
          example: 0.14
          description: USD per million cache-write tokens. Null prices them as input tokens.
        context_window:
          type:
            - integer
            - "null"
          example: 1000000
          description: The model's context window, in tokens
        supports_vision:
          type: boolean
          example: false
          description: Whether the model accepts images
        effort_routing_enabled:
          type: boolean
          example: false
          description: Lets the router pick the model's reasoning effort. Only on models the router model has efforts for (`efforts` in `GET /v1/router-models`); it's stored off on any other.
        extra_fields:
          type:
            - object
            - "null"
          example: null
          description: Per-model overrides, such as `always_on_reasoning` set to true for a model that can't turn reasoning off
    RouterTargetModelInput:
      type: object
      description: |-
        A model for the router to route across.

        **Required:** `name`, and on a gateway router, `provider` for every enabled model.

        **Everything else is optional.** A field you leave out (or send as null) gets Emissary's default for the model: its entry in the router model's catalog, which `GET /v1/router-models` lists under `router_models[].models`. Send a field only to override that default, for example your own negotiated prices.

        | Field | Default when left out |
        | --- | --- |
        | `model_id` | Proposal Mode router: the model's `name`. Gateway router: the model's id at `provider`, from the catalog entry's `providers`. No default when the catalog has no id for the provider (`litellm`), so send it. |
        | `input_per_mtok`, `output_per_mtok`, `cache_read_per_mtok`, `cache_write_per_mtok` | The catalog entry's prices |
        | `context_window`, `supports_vision` | The catalog entry's values |
        | `enabled` | `true` |
        | `effort_routing_enabled` | `false` |

        Defaults are copied into the router when it's saved, and the response shows every field as saved. A later change to the catalog doesn't change a saved router.
      required:
        - name
      properties:
        name:
          type: string
          example: "deepseek-v4-flash"
          description: The model's catalog name, which is also the router model's label for it. Must be one the router model lists (`router_models[].models[].name` in `GET /v1/router-models`), and unique within the router.
        provider:
          type: string
          enum:
            - anthropic
            - openrouter
            - openai
            - litellm
            - baseten
          example: "openrouter"
          description: Where the gateway serves the model, with the key you add for it in `providers`. Required for every enabled model of a gateway router; not allowed on a Proposal Mode router. With a provider the catalog entry has no id for (such as `litellm`), send `model_id` too.
        model_id:
          type: string
          example: "deepseek/deepseek-v4-flash"
          description: The id the model is called by. On a gateway router, what Emissary sends the provider; on a Proposal Mode router, what `POST /v1/route` returns for your app to send. Default, the model's `name` on a Proposal Mode router and its id at `provider` (catalog `providers`) on a gateway router; required for `litellm`, whose ids are your own.
        enabled:
          type: boolean
          default: true
          description: A disabled model stays on the router but is never picked. The router's `default` must be enabled.
        input_per_mtok:
          type: number
          example: 0.14
          description: USD per million input tokens. Default, the catalog entry's `input_per_mtok`.
        output_per_mtok:
          type: number
          example: 0.28
          description: USD per million output tokens. Default, the catalog entry's `output_per_mtok`.
        cache_read_per_mtok:
          type: number
          example: 0.028
          description: USD per million cache-read tokens. Default, the catalog entry's `cache_read_per_mtok`.
        cache_write_per_mtok:
          type: number
          example: 0.14
          description: USD per million cache-write tokens. Default, the catalog entry's `cache_write_per_mtok`.
        context_window:
          type: integer
          example: 1000000
          description: The model's context window, in tokens. Default, the catalog entry's `context_window`.
        supports_vision:
          type: boolean
          description: Whether the model accepts images. Default, the catalog entry's `supports_vision`.
        effort_routing_enabled:
          type: boolean
          default: false
          description: Lets the router pick the model's reasoning effort. Takes effect only on a model whose catalog entry lists `efforts`; on any other it's stored off.
        extra_fields:
          type: object
          description: Per-model overrides, such as `always_on_reasoning` set to true for a model that can't turn reasoning off
    RouterProvider:
      type: object
      description: A provider credential on a gateway router. The key itself is never returned.
      properties:
        name:
          type: string
          example: "openrouter"
        api_base_url:
          type:
            - string
            - "null"
          example: null
          description: The endpoint used instead of the provider's default
        has_api_key:
          type: boolean
          example: true
    RouterProviderInput:
      type: object
      description: A provider's credential, for a gateway router. Send one for each provider the router's models name; entries for any other provider are ignored.
      required:
        - name
      properties:
        name:
          type: string
          enum:
            - anthropic
            - openrouter
            - openai
            - litellm
            - baseten
          example: "openrouter"
        api_key:
          type: string
          writeOnly: true
          example: "sk-or-v1-..."
          description: Stored encrypted and never returned. Required for a provider new to the router; left out, the stored key is kept.
        api_base_url:
          type: string
          example: "https://litellm.example.com/v1"
          description: An endpoint to use instead of the provider's default. Required for `litellm`, which has none.
    RouterCreate:
      type: object
      required:
        - name
        - mode
        - default
        - target_models
      properties:
        name:
          type: string
          maxLength: 100
          example: "prod"
          description: Unique within your account (or organization)
        mode:
          type: string
          enum:
            - proposal
            - gateway
          example: proposal
          description: How your app calls the router. Fixed once it's created.
        router_model:
          type: string
          example: "emissary-model-router-shared-v3"
          description: One of the router models `GET /v1/router-models` lists. Defaults to its `default`.
        default:
          type: string
          example: "claude-haiku-4.5"
          description: The name of the model the router falls back to. One of the enabled `target_models`.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.65
          description: Minimum score a model needs before it can be picked instead of the default. Defaults to the router model's recommended confidence.
        is_zdr:
          type: boolean
          default: true
          description: Zero data retention. Set false to keep request and response payloads for session replay on the dashboard.
        target_models:
          type: array
          description: |-
            The models the router can pick, at least the `default`. Each entry needs only `name` (and `provider` on a gateway router): any field left out gets Emissary's default for the model, from `GET /v1/router-models`. See the item schema for each field's default.
          items:
            "$ref": "#/components/schemas/RouterTargetModelInput"
        providers:
          type: array
          description: Gateway routers only. A key for each provider the models name.
          items:
            "$ref": "#/components/schemas/RouterProviderInput"
    RouterUpdate:
      type: object
      description: The fields to change. Any field left out keeps its current value.
      properties:
        name:
          type: string
          maxLength: 100
          example: "prod-v2"
          description: A new name. Requests that use the old name fail with 404 from then on.
        mode:
          type: string
          enum:
            - proposal
            - gateway
          description: Can't change. Accepted only when it's the router's current mode.
        router_model:
          type: string
          example: "emissary-model-router-shared-v3"
          description: One of the router models `GET /v1/router-models` lists
        default:
          type: string
          example: "claude-haiku-4.5"
          description: The name of the model the router falls back to. One of the enabled `target_models`.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          example: 0.5
        is_zdr:
          type: boolean
        target_models:
          type: array
          description: |-
            Replaces the router's models as a whole: send every model the router should keep. Entries take defaults as on create, from `GET /v1/router-models`, not from the router's current models. A model you resend without its prices gets the catalog's prices again, so resend any you've overridden.
          items:
            "$ref": "#/components/schemas/RouterTargetModelInput"
        providers:
          type: array
          description: Replaces the router's provider credentials as a whole. A provider sent without `api_key` keeps its stored key.
          items:
            "$ref": "#/components/schemas/RouterProviderInput"
    RouterModelList:
      type: object
      properties:
        default:
          type: string
          example: "emissary-model-router-shared-v3"
          description: The router model a new router uses when it names none
        router_models:
          type: array
          items:
            "$ref": "#/components/schemas/RouterModel"
    RouterModel:
      type: object
      description: A router model, the classifier that scores each request
      properties:
        id:
          type: string
          example: "emissary-model-router-shared-v3"
          description: What a router's `router_model` names
        family:
          type: string
          example: "emissary-model-router-shared"
        version:
          type: integer
          example: 3
        type:
          type: string
          enum:
            - label_classifier
          example: label_classifier
        status:
          type: string
          enum:
            - active
            - deprecated
            - retired
          example: active
        display_name:
          type: string
          example: "Shared router v3"
        description:
          type: string
        recommended:
          type: object
          properties:
            confidence:
              type: number
              example: 0.65
              description: The confidence a new router on this router model starts with
            presets:
              type: array
              description: Suggested sets of models to start a router from
              items:
                "$ref": "#/components/schemas/RouterPreset"
        models:
          type: array
          description: The models a router on this router model can route across, cheapest first
          items:
            "$ref": "#/components/schemas/RouterCatalogModel"
    RouterCatalogModel:
      type: object
      description: A model in the router model's catalog, with Emissary's default prices
      properties:
        name:
          type: string
          example: "deepseek-v4-flash-0731"
          description: What a router's `target_models[].name` names
        providers:
          type: object
          additionalProperties:
            type: string
          example:
            openrouter: "deepseek/deepseek-v4-flash-0731"
          description: The model's id at each provider that serves it
        default_provider:
          type: string
          example: "openrouter"
        input_per_mtok:
          type: number
          example: 0.14
        output_per_mtok:
          type: number
          example: 0.28
        cache_read_per_mtok:
          type: number
          example: 0.028
        cache_write_per_mtok:
          type: number
          example: 0.14
        context_window:
          type: integer
          example: 1000000
        supports_vision:
          type: boolean
          example: false
        blurb:
          type: string
          description: A short description of the model
        efforts:
          type: array
          items:
            type: string
          example:
            - low
            - medium
            - high
          description: The reasoning efforts the router model can pick for this model. Empty means no effort routing on it.
    RouterPreset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        default:
          type: string
          description: The preset's default model
        models:
          type: array
          items:
            type: string
          description: The preset's model names
        confidence:
          type: number
          description: The confidence the preset starts with
    ApiErrorInvalidRouter:
      type: object
      properties:
        error:
          type: string
          example: Invalid router
        details:
          type: array
          items:
            "$ref": "#/components/schemas/RouterFieldError"
    RouterFieldError:
      type: object
      properties:
        field:
          type: string
          example: mode
          description: The field at fault, as a dotted path into the request body (such as `target_models.0.input_per_mtok`). Empty when the problem is the router as a whole.
        message:
          type: string
          example: 'mode is required: "proposal" or "gateway"'
    ApiErrorRouterNotFound:
      type: object
      properties:
        error:
          type: string
          example: 'No router named "staging"'
    RouteRequest:
      type: object
      required:
        - router
        - body
      properties:
        router:
          type: string
          example: "prod"
          description: The name of one of your Proposal Mode routers
        body:
          type: object
          additionalProperties: true
          description: The request as your app will send it to the provider, in OpenAI Chat Completions, OpenAI Responses or Anthropic Messages format. Its `model` is your own and is only logged.
        session_id:
          type: string
          example: "conv-8f2c"
          description: The conversation the request belongs to. Left out, it's read from `headers` when a known client sent one.
        headers:
          type: object
          additionalProperties:
            type: string
          description: The end client's request headers, used to recognize the client (Claude Code, Codex and others) and its session
        request_id:
          type: string
          example: "my-req-001"
          description: Your own id for the request, returned as is
    RouteProposal:
      type: object
      properties:
        decision_id:
          type: string
          example: "dec-2b7e1f0c-9a4d-4c3e-8f5a-6d1b2c3e4f5a"
          description: Identifies this decision. Report its usage to `POST /v1/route/{decision_id}/usage`.
        request_id:
          type:
            - string
            - "null"
          example: "my-req-001"
          description: The `request_id` you sent, if any
        reason:
          type: string
          example: cheapest_confident
          description: |-
            Why the first candidate leads. One of:

            - `cheapest_confident`: the cheapest model confident enough to take the request
            - `warm_cheapest`: the default, cheapest once its warm prompt cache is counted
            - `escalated`: the default wasn't confident and every confident model costs more, so the cheapest of those
            - `no_confident`: no model was confident enough, so the default
            - `context_exceeds_config`: the request is longer than every model's context window, so the default
            - `unrecognized_payload`: nothing to score in `body`, so the default
            - `fallback:router_issue`: scoring failed, so the default
            - `fallback:label_mismatch`: the router model can't score some of the router's models, so the default
        candidates:
          type: array
          description: The router's models, most recommended first. The first is its choice; move down the list if calling it fails.
          items:
            "$ref": "#/components/schemas/RouteCandidate"
        warnings:
          type: array
          description: What you can act on about this request or its result. Usually empty.
          items:
            "$ref": "#/components/schemas/RouteWarning"
    RouteCandidate:
      type: object
      properties:
        model:
          type: string
          example: "deepseek-v4-flash-0731"
          description: The model's name on the router. Send it as `model` when you report usage.
        model_id:
          type: string
          example: "deepseek/deepseek-v4-flash-0731"
          description: The id to call the model by, as set on the router
        confidence:
          type:
            - number
            - "null"
          example: 0.96
          description: The router model's score for this model on the request, from 0 to 1
        effort:
          type:
            - string
            - "null"
          example: low
          description: The reasoning effort the router picked for the model, to set on the request. Null leaves the request's own effort.
    RouteWarning:
      type: object
      properties:
        code:
          type: string
          enum:
            - unreadable_request
            - router_unavailable
            - label_mismatch
            - context_exceeds_models
            - no_session
          example: no_session
          description: |-
            A stable code to branch on:

            - `unreadable_request`: no task or conversation could be read from `body`, so the default is proposed
            - `router_unavailable`: the router model didn't answer, so the default is proposed
            - `label_mismatch`: the router model can't score some of the router's models, so the default is proposed
            - `context_exceeds_models`: the request is longer than every model's context window; the default is proposed, but its provider will likely refuse it
            - `no_session`: the request continues a conversation but no session id was found, so routing can't tell which model's cache is warm
        message:
          type: string
          example: "This request continues a conversation, but no session id was found in `session_id` or `headers`, so routing can't see which model's cache is warm."
    UsageReport:
      type: object
      required:
        - model
        - usage
      properties:
        model:
          type: string
          example: "deepseek-v4-flash-0731"
          description: The `model` of the candidate your app served
        usage:
          type: object
          additionalProperties: true
          description: The provider's `usage` object, as it returned it (Anthropic Messages, OpenAI Chat Completions or OpenAI Responses)
        status:
          type: integer
          example: 200
          description: The provider's HTTP status
    ApiErrorMessage:
      type: object
      properties:
        error:
          type: string
          example: "`router`: Field required"
    GatewayChatCompletionsRequest:
      type: object
      description: An OpenAI Chat Completions request. Parameters not listed here are passed to the provider as sent.
      required:
        - model
        - messages
      additionalProperties: true
      properties:
        model:
          type: string
          example: "prod-gateway"
          description: The name of one of your gateway routers
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: false
        session_id:
          type: string
          description: The conversation the request belongs to, when no header carries it. Read by the gateway and not sent to the provider.
    GatewayResponsesRequest:
      type: object
      description: An OpenAI Responses request. Parameters not listed here are passed to the provider as sent.
      required:
        - model
        - input
      additionalProperties: true
      properties:
        model:
          type: string
          example: "prod-gateway"
          description: The name of one of your gateway routers
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
        stream:
          type: boolean
          default: false
        session_id:
          type: string
          description: The conversation the request belongs to, when no header carries it. Read by the gateway and not sent to the provider.
    GatewayMessagesRequest:
      type: object
      description: An Anthropic Messages request. Parameters not listed here are passed to the provider as sent.
      required:
        - model
        - messages
      additionalProperties: true
      properties:
        model:
          type: string
          example: "prod-gateway"
          description: The name of one of your gateway routers
        max_tokens:
          type: integer
          example: 1024
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
          default: false
        session_id:
          type: string
          description: The conversation the request belongs to, when no header carries it. Read by the gateway and not sent to the provider.
    GatewayResponse:
      type: object
      additionalProperties: true
      description: The provider's answer in the format of the request. Its `model` is the id of the model that served it.
    OpenAIError:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type:
                - string
                - "null"
            code:
              type: string
    AnthropicError:
      type: object
      properties:
        type:
          type: string
          example: error
        error:
          type: object
          properties:
            type:
              type: string
            message:
              type: string
  responses:
    Unauthorized:
      description: Unauthorized error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorUnauthorized"
    NotFound:
      description: Not Found error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorNotFound"
    InvalidInput:
      description: Invalid Input error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorInvalidInput"
    Forbidden:
      description: The API key is not valid
    InvalidRouter:
      description: The router can't be saved as sent. `details` names each problem.
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorInvalidRouter"
          example:
            error: Invalid router
            details:
              - field: target_models
                message: "A gateway router needs a provider on every enabled model: claude-haiku-4.5"
    RouterNameTaken:
      description: Another of your routers has this name
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorInvalidRouter"
          example:
            error: Invalid router
            details:
              - field: name
                message: 'A router named "prod" already exists — please try to set with a different name. The router name used as an identifier within your account/org.'
    RouterNotFound:
      description: None of your routers has this name
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorRouterNotFound"
    GatewayRefused:
      description: The request can't be served as sent, for example because its body isn't a JSON object or `model` names a Proposal Mode router
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorMessage"
          example:
            error: 'Router "prod" is a Proposal Mode router, so the gateway can''t serve it. Call it with POST /v1/route, or create a gateway router to call through the gateway.'
    GatewayRouterNotFound:
      description: None of your routers has the name in `model`
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ApiErrorMessage"
          example:
            error: "No router named 'staging': the request's `model` must be one of your router names"
    InsufficientCreditsOpenAI:
      description: Your prepaid credits are exhausted
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OpenAIError"
          example:
            error:
              message: Your prepaid credit balance is exhausted. Buy credits or turn on auto-recharge to continue.
              type: insufficient_quota
              param: null
              code: insufficient_credits
    InsufficientCreditsAnthropic:
      description: Your prepaid credits are exhausted
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AnthropicError"
          example:
            type: error
            error:
              type: billing_error
              message: Your prepaid credit balance is exhausted. Buy credits or turn on auto-recharge to continue.
    UpstreamTimeoutOpenAI:
      description: The model's provider didn't respond
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/OpenAIError"
          example:
            error:
              message: The upstream model provider did not respond (ReadTimeout).
              type: timeout
              code: upstream_timeout
    UpstreamTimeoutAnthropic:
      description: The model's provider didn't respond
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AnthropicError"
          example:
            type: error
            error:
              type: api_error
              message: The upstream model provider did not respond (ReadTimeout).
    ProviderError:
      description: An error from the model's provider, passed through with its status and body
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
  headers:
    ExpiresAfter:
      description: date in UTC when token expires
      schema:
        type: string
        format: date-time
  # Security scheme definitions that can be used across the definition.
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-Key
      in: header
