openapi: 3.1.0
info:
  title: Emissary API
  description: |-
    v0.1.0
  termsOfService: https://www.withemissary.com/terms-of-service
  contact:
    email: contact@withemissary.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.1.0
security:
  - api_key: []
servers:
  - url: https://api.withemissary.com
    description: Emissary API server
tags:
  - name: Routers
    description: Create and manage the routers that Proposal Mode (`POST /v1/route`) and the gateway call by name
  - name: Proposal Mode
    description: Ask a Proposal Mode router which model to use, call it with your own keys, then report its usage
  - name: Gateway
    description: OpenAI- and Anthropic-compatible endpoints that route each request through a gateway router and serve it
  - name: Experiments (Playground)
    description: API for Playground Experiments (Zero-shot Deployment)
  - name: Projects
    description: Deals with projects (workspace)
  - name: Datasets
    description: Datasets are used to upload documents that can be used for fine-tuning
  - name: Training Jobs
    description: Deals with training jobs
  - name: Deployments
    description: Deals with deployments
  - name: Inference Engines
    description: Inference Engine API endpoints
  - name: Inference
    description: Deals with inference request to the deployed model
  - name: Base Models
    description: Deals with base models
  - name: Testing Functions
    description: Built-in testing functions available for evaluating training jobs
paths:
  '/v1/experiments':
    post:
      tags:
        - Experiments (Playground)
      summary: Create new experiment (zero-shot deployment)
      description: Create a new experiment. Same as creating a new zero-shot deployment which you can directly integrate into usage.
      operationId: createExperiment
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: my_experiment
                  description: The name of the experiment
                mode:
                  type: string
                  enum:
                    - tool_calling
                    - judge
                    - decision
                    - routing
                    - ner
                    - regression
                  example: "judge"
                  description: |
                    The mode of the experiment. The mode determines how `classes` must be specified:
                      - `tool_calling`: Agentic tool use. Each item in `classes` represents a tool the model can call.
                      - `judge`: LLM-as-judge for scoring outputs against a single metric. `classes` must contain exactly one item.
                      - `decision`: Multi-class decision/classification. Each item in `classes` represents a possible decision label.
                      - `routing`: Route an input between possible destinations. Each item in `classes` represents a route.
                      - `ner`: Named entity recognition. Each item in `classes` represents an entity type to extract.
                      - `regression`: Score an input on a numeric scale. `classes` must contain exactly one item.
                classes:
                  type: array
                  description: |
                    The classes for the experiment. The shape and length constraints depend on `mode`:
                      - `tool_calling`, `decision`, `routing`, `ner`: one or more items, each with `name` and `description`.
                      - `judge`: exactly one item where `name` is the metric name and `description` is the judgment criteria.
                      - `regression`: exactly one item with `name`, `description`, plus the additional required fields `min_value`, `max_value`, `low_description`, `high_description`, and `higher_means`.
                  items:
                    oneOf:
                      - type: object
                        title: Class
                        description: Used for `tool_calling`, `decision`, `routing`, and `ner` modes.
                        properties:
                          name:
                            type: string
                            example: "my_class"
                            description: The name of the class.
                          description:
                            type: string
                            example: "Description of the class"
                            description: A description of the class.
                        required:
                          - name
                          - description
                      - type: object
                        title: JudgeClass
                        description: Used for `judge` mode. `classes` must contain exactly one item of this type.
                        properties:
                          name:
                            type: string
                            example: "helpfulness"
                            description: The name of the metric being judged.
                          description:
                            type: string
                            example: "Rate how helpful the response is in addressing the user's question."
                            description: The criteria the judge should use to evaluate the response.
                        required:
                          - name
                          - description
                      - type: object
                        title: RegressionClass
                        description: Used for `regression` mode. `classes` must contain exactly one item of this type.
                        properties:
                          name:
                            type: string
                            example: "quality_score"
                            description: The name of the metric.
                          description:
                            type: string
                            example: "Overall quality of the response."
                            description: A description of what the metric measures.
                          min_value:
                            type: integer
                            example: 1
                            description: The minimum value of the score range.
                          max_value:
                            type: integer
                            example: 10
                            description: The maximum value of the score range.
                          low_description:
                            type: string
                            example: "Poor quality response that does not address the question."
                            description: A description of what a score at `min_value` represents.
                          high_description:
                            type: string
                            example: "Excellent response that fully addresses the question."
                            description: A description of what a score at `max_value` represents.
                          higher_means:
                            type: string
                            example: "better"
                            description: What a higher score indicates (e.g. `better`, `worse`).
                        required:
                          - name
                          - description
                          - min_value
                          - max_value
                          - low_description
                          - high_description
                          - higher_means
              required:
                - name
                - mode
                - classes

  '/v1/projects': # path parameter in curly braces
    post:
      tags:
        - Projects
      summary: Create project
      description: Create a new project. Projects can be created and used to organize datasets, training jobs, and deployments.
      operationId: createProject
      requestBody:
        #        description: Provide your project name if you want to specify it.
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: my_project
                  description: The name of the project
        required: false
      responses:
        '201':
          description: The created Project's summary object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectSummary"
        '400':
          $ref: '#/components/responses/InvalidInput'
    get:
      tags:
        - Projects
      # documentation for GET operation for this path
      summary: List projects
      # you can use GFM in operation description too: https://guides.github.com/features/mastering-markdown
      description: |
        Returns a list of projects.
      # operationId should be unique across the whole specification
      operationId: listProjects
      # security schemas applied to this operation
      responses:
        '200':
          description: List of Project's summary object.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/ProjectSummary"
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/v1/projects/{project_id}':
    get:
      tags:
        - Projects
      summary: Retrieve project
      description: Retrieve a project.
      operationId: retrieveProjectById
      parameters:
        - name: project_id
          in: path
          schema:
            type: string
          description: The ID of the project.
          required: true
      responses:
        '200':
          description: The ProjectDetail object matching the specified ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProjectDetail"
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Projects
      summary: Delete project
      description: Delete a project.
      operationId: deleteProjectById
      parameters:
        - name: project_id
          in: path
          schema:
            type: string
          description: The ID of the project.
          required: true
      responses:
        '204':
          description: Project deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/projects/{project_id}/datasets':
    post:
      tags:
        - Datasets
      summary: Upload dataset
      description: Upload dataset to the project (upto 100MB). Upload through UI if your dataset size is larger than 100MB.
      operationId: createDataset
#      x-codeSamples:
#        - lang: Python
#          source: |
#            import requests
#
#            url = "https://api.withemissary.com/v1/projects/{project_id}/datasets"
#
#            # Use the `files` parameter for multipart/form-data uploads.
#            # Don't set Content-Type manually — requests sets it (with the
#            # boundary) automatically when you pass `files`.
#            files = {
#                "file": ("dataset.jsonl", open("./dataset.jsonl", "rb"), "application/json"),
#            }
#
#            # Optional metadata as additional form fields.
#            data = {
#                "name": "my_dataset",
#            }
#
#            headers = {
#                "Accept": "application/json",
#                "X-API-Key": "YOUR_API_KEY",
#            }
#
#            response = requests.post(url, headers=headers, files=files, data=data)
#
#            print(response.status_code)
#            print(response.json())
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The dataset file (binary format) to upload
                name:
                  type: string
                  example: my_dataset
                  description: The name of the dataset (optional)
              required:
                - file
      responses:
        '201':
          description: The Dataset's summary object.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DatasetSummary"
        '400':
          $ref: '#/components/responses/InvalidInput'
    get:
      tags:
        - Datasets
      summary: List datasets
      description: Returns a list of datasets
      operationId: listDatasets
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: List of Dataset's summary object.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/DatasetSummary"
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/v1/projects/{project_id}/datasets/{dataset_id}':
    get:
      tags:
        - Datasets
      summary: Retrieve dataset
      description: Retrieve a dataset.
      operationId: retrieveDatasetById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: dataset_id
          in: path
          required: true
          description: The ID of the dataset.
          schema:
            type: string
      responses:
        '200':
          description: The DatasetDetail object matching the specified ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DatasetDetail"
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Datasets
      summary: Delete dataset
      description: Delete a dataset.
      operationId: deleteDatasetById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: dataset_id
          in: path
          required: true
          description: The ID of the dataset
          schema:
            type: string
      responses:
        '204':
          description: Dataset deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/projects/{project_id}/training-jobs':
    post:
      tags:
        - Training Jobs
      summary: Create SFT training job
      description: Initiate fine-tuning (training job).
      operationId: createTrainingJob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_model_option:
                  type: string
                  enum:
                    - pre-trained
                    - fine-tuned
                  example: "pre-trained"
                  description: Base Model option to be used (default = "pre-trained"), you can either start from the pure base model (pre-trained) or from any checkpoint for your fine-tuned model (fine-tuned)
                base_model:
                  type: string
                  example: "Llama-3.2-1B-Instruct"
                  description: The base model to fine-tune. To see full list of supported base model please visit [Base Models](/fine-tuning/parameters#available-base-models). If you are training on fine-tuned base model option, specify the training job name you want to use.
                checkpoint:
                  type: number
                  example: 5
                  description: If base_model_option == "fine-tuned", specify the checkpoint you want to use.
                train_dataset_id:
                  type: string
                  example: "ds-12345"
                  description: The training dataset ID to use for fine-tuning
                test_dataset_id:
                  type: string
                  example: "ds-67890"
                  description: The testing dataset ID to use for fine-tuning (optional)
                train_test_split_ratio:
                  type: number
                  example: 20
                  description: The ratio (%) to split the training dataset for testing (optional)
                test_functions:
                  type: array
                  example: ["test_similarity_shared"]
                  items:
                    type: string
                    description: List of test function names to be used (optional)
                name:
                  type: string
                  example: "training-job-1"
                  description: The name of the training job (optional)
                description:
                  type: string
                  example: "Fine-tuning the model on my dataset"
                  description: A description of the training job (optional)
                task_type:
                  type: string
                  enum:
                    - text-generation
                    - classification
                    - embedding
                    - regression
                  example: "text-generation"
                  description: The task type for the training job (default = "text-generation")
                parameters:
                  type: object
                  properties:
                    downsample_size:
                      type: number
                      example: 20
                    learning_rate:
                      type: number
                      example: 0.0002
                    num_train_epochs:
                      type: number
                      example: 3
                    per_device_train_batch_size:
                      type: number
                      example: 2
                    per_device_eval_batch_size:
                      type: number
                      example: 2
                    dynamic_loss:
                      type: boolean
                      example: false
                      description: (Default = false) Set to true if you want to enable dynamic loss function
                  description: The hyper parameters to use for fine-tuning (optional)
                rebalance_data:
                  description: (Optional) Currently only supported for classification task type.
                  oneOf:
                    - title: ratio
                      type: object
                      description: |
                        A mapping from category labels (as keys) to the ratio for resampling the dataset. The total size of the dataset will remain consistently.
                      additionalProperties:
                        type: number
                        format: float
                      example:
                        label1: 0.3
                        label2: 0.7
                    - title: number
                      type: object
                      description: |
                        A mapping from category labels (as keys) to the number for resampling the dataset. The exact number of data will be created or deleted to fit the number that is provided
                      additionalProperties:
                        type: number
                      example:
                        label1: 300
                        label2: 300
                        label3: 500
                hf_model_link:
                  type: string
                  example: "https://huggingface.co/my_model"
                  description: Link to the Hugging Face model / Use only when you use the HF_MODEL as a base
              required:
                - base_model
                - train_dataset_id
      responses:
        '201':
          description: Returns the TrainingJob's summary object.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TrainingJobSummary"
        '400':
          $ref: '#/components/responses/InvalidInput'
    get:
      tags:
        - Training Jobs
      summary: List training jobs
      description: Returns a list of training jobs
      operationId: listTrainingJobs
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: List of TrainingJob's summary object.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TrainingJobSummary"
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/v1/projects/{project_id}/training-jobs/grpo':
    post:
      tags:
        - Training Jobs
      summary: Create GRPO training job
      description: Initiate GRPO fine-tuning (training job).
      operationId: createGRPOTrainingJob
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                base_model_option:
                  type: string
                  enum:
                    - pre-trained
                    - fine-tuned
                  example: "pre-trained"
                  description: Base Model option to be used (default = "pre-trained"), you can either start from the pure base model (pre-trained) or from any checkpoint for your fine-tuned model (fine-tuned)
                base_model:
                  type: string
                  example: "Llama-3.2-1B-Instruct"
                  description: The base model to fine-tune. To see full list of supported base model please visit [Base Models](/fine-tuning/parameters#available-base-models). If you are training on fine-tuned base model option, specify the training job name you want to use.
                checkpoint:
                  type: number
                  example: 5
                  description: (Required if base_model_option == "fine-tuned"), specify the checkpoint you want to use.
                train_dataset_id:
                  type: string
                  example: "ds-12345"
                  description: The training dataset ID to use for fine-tuning
                test_functions:
                  type: array
                  example: [ "test_similarity_shared" ]
                  items:
                    type: string
                    description: Name of test function to be used
                reward:
                  type: object
                  description: (GRPO) Reward weight map
                  properties:
                    test_function_1:
                      type: float
                      example: 0.2
                    test_function_2:
                      type: float
                      example: 0.8
                test_dataset_id:
                  type: string
                  example: "ds-67890"
                  description: The testing dataset ID to use for fine-tuning (optional)
                train_test_split_ratio:
                  type: number
                  example: 20
                  description: The ratio (%) to split the training dataset for testing (optional)
                name:
                  type: string
                  example: "training-1"
                  description: The name of the training job (optional)
                description:
                  type: string
                  example: "Fine-tuning the model on my dataset"
                  description: A description of the training job (optional)
                task_type:
                  type: string
                  enum:
                    - text-generation
                    - classification
                    - embedding
                    - regression
                  example: "text-generation"
                  description: The task type for the training job (default = "text-generation")
                parameters:
                  type: object
                  properties:
                    learning_rate:
                      type: number
                      example: 0.0002
                    num_train_epochs:
                      type: number
                      example: 15
                    num_generations:
                      type: number
                      example: 4
                    per_device_train_batch_size:
                      type: number
                      example: 4
                hf_model_link:
                  type: string
                  example: "https://huggingface.co/my_model"
                  description: Link to the Hugging Face model / Use only when you use the HF_MODEL as a base
              required:
                - base_model
                - train_dataset_id
                - test_functions
                - reward
      responses:
        '201':
          description: Returns the TrainingJob's summary object.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TrainingJobSummary"
        '400':
          $ref: '#/components/responses/InvalidInput'
  '/v1/projects/{project_id}/training-jobs/{training_job_id}':
    get:
      tags:
        - Training Jobs
      summary: Retrieve training job
      description: Retrieve a training job.
      operationId: retrieveTrainingJobById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: training_job_id
          in: path
          required: true
          description: The ID of the training job.
          schema:
            type: string
      responses:
        '200':
          description: The TrainingJobDetail object matching the specified ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TrainingJobDetail"
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Training Jobs
      summary: Delete training job
      description: Delete a training job.
      operationId: deleteTrainingJobById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: training_job_id
          in: path
          required: true
          description: The ID of the training job
          schema:
            type: string
      responses:
        '204':
          description: Training job deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/projects/{project_id}/training-jobs/{training_job_id}/cancel':
    post:
      tags:
        - Training Jobs
      summary: Cancel training job
      description: Cancel a training job.
      operationId: cancelTrainingJobById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: training_job_id
          in: path
          required: true
          description: The ID of the training job
          schema:
            type: string
      responses:
        '204':
          description: Training job canceled successfully
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/projects/{project_id}/training-jobs/{training_job_id}/checkpoints':
    get:
      tags:
        - Training Jobs
      summary: List checkpoints
      description: Returns a list of checkpoints for a training job.
      operationId: listCheckpoints
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: training_job_id
          in: path
          required: true
          description: The ID of the training job
          schema:
            type: string
      responses:
        '200':
          description: List of TrainingJobCheckpoint object.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/TrainingJobCheckpoint"
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/projects/{project_id}/deployments':
    post:
      tags:
        - Deployments
      summary: Create deployment
      description: Create a new deployment.
      operationId: createDeployment
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                training_job_id:
                  type: string
                  example: "tr-12345"
                  description: The training job ID to use for deployment or the model name for base model deployment
                checkpoint:
                  type: integer
                  example: 4
                  description: The checkpoint number to use for deployment (0 for base model deployment)
                name:
                  type: string
                  example: "deployment-1"
                  description: The name of the deployment
                description:
                  type: string
                  example: "Deployment for my training job"
                  description: A description of the deployment
                inactive_timeout:
                  type: integer
                  example: 3600
                  description: Inactive Timeout (seconds) (default = 3600). Specifies the period of inactivity, in seconds, after which the deployment will be automatically deactivated if no incoming requests are received. While deactivated, the deployment incurs no charges. When a request is sent to a deactivated deployment, it will be reactivated to process the request; this reactivation process typically introduces a delay of approximately 8 to 20 minutes before the deployment becomes fully operational.
                schedule:
                  type: object
                  properties:
                    timezone:
                      type: string
                      example: "America/Los_Angeles"
                      description: The IANA timezone for the schedule
                    start_time:
                      type: string
                      example: "10:00"
                      description: The start time for the schedule in HH:MM format
                    end_time:
                      type: string
                      example: "18:00"
                      description: The end time for the schedule in HH:MM format
                    days:
                      type: array
                      example: ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"]
                      items:
                        type: string
                        enum:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          - sunday
                      description: The days of the week for the schedule
              required:
                - training_job_id
                - checkpoint
      responses:
        '201':
          description: The created Deployment's summary object
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeploymentSummary"
        '400':
          $ref: '#/components/responses/InvalidInput'
    get:
      tags:
        - Deployments
      summary: List deployments
      description: Returns a list of deployments
      operationId: listDeployments
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: List of Deployment's summary object.
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/DeploymentSummary"
        '401':
          $ref: '#/components/responses/Unauthorized'
  '/v1/projects/{project_id}/deployments/{deployment_id}':
    get:
      tags:
        - Deployments
      summary: Retrieve deployment
      description: Retrieve a deployment.
      operationId: retrieveDeploymentById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: deployment_id
          in: path
          required: true
          description: The ID of the deployment.
          schema:
            type: string
      responses:
        '200':
          description: The DeploymentDetail object matching the specified ID.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/DeploymentDetail"
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Deployments
      summary: Delete deployment
      description: Delete a deployment.
      operationId: deleteDeploymentById
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: deployment_id
          in: path
          required: true
          description: The ID of the deployment
          schema:
            type: string
      responses:
        '204':
          description: Deployment deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
  '/v1/projects/{project_id}/deployments/{deployment_id}/reactivate':
    post:
      tags:
        - Deployments
      summary: Reactivate deployment
      description: Reactivate a deactivated deployment.
      operationId: reactivateDeploymentById
      parameters:
